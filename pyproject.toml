[project]
name = "gttrl"
version = "2.0.0"
description = "A cross-platform CLI launcher for Toontown Rewritten."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "glomatico" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["toontown", "toontown-rewritten", "launcher", "cli", "gaming"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "aiofiles>=24",
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=25",
    "questionary>=2",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/glomatico/gttrl"
Repository = "https://github.com/glomatico/gttrl"

[project.scripts]
gttrl = "gttrl.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
