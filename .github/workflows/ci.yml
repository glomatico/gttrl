name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --locked --python ${{ matrix.python-version }} ruff check src tests
      - name: Tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Check packaged entry point
        run: |
          uvx --from dist/gttrl-*.whl gttrl --version
          uvx --from dist/gttrl-*.whl gttrl --help
